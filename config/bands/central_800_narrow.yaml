# The sub-range one 5 MS/s capture centred at 867.406250 MHz can actually
# cover, rather than the full 866-870 MHz the `central_800` profile asks
# for.
#
# This still says only *where to look*. It encodes no frequency list and no
# protocol -- a geolocation campaign wants `coverage_status: complete` to
# mean something, and asking for 4 MHz from a capture whose usable passband
# is nearer 4.2 MHz around a centre that is not the band's midpoint makes
# every run report `partial` for a reason that has nothing to do with the
# recording quality.
#
# Detection thresholds, rasters, segmentation and comparison tolerances are
# character-for-character identical to `central_800.yaml`: runs made with
# either profile are measured on the same terms and stay comparable.
name: central_800_narrow
label: "800 MHz public safety (866.000-868.800 MHz), one 5 MS/s capture"

start_frequency_hz: 866000000
stop_frequency_hz: 868800000

raster_spacings_hz:
  - 12500
  - 6250

detection:
  scan_step_hz: 6250
  integration_width_hz: 12500
  min_p95_channel_snr_db: 9.0
  min_average_channel_snr_db: 4.0
  min_equivalent_width_hz: 3000
  min_width_90_hz: 5000
  max_width_90_hz: 13000
  max_peak_to_channel_mean_db: 13.0
  min_fill_ratio: 0.20
  fill_threshold_db: 6.0
  merge_tolerance_hz: 4000

# A geolocation stop is a short stationary capture, so segmentation is
# tuned the same way the recon profile is: enough segments in 60-180 s for
# persistence to mean something.
segment_seconds: 1.0
segment_stride_seconds: 5.0
max_segments: 40

usable_passband_rolloff_db: 3.0

comparison:
  frequency_tolerance_hz: 6250
  snr_delta_db: 3.0
  occupancy_delta_pct: 10.0
  persistence_delta: 0.25
  analyzed_seconds_ratio_limit: 4.0
