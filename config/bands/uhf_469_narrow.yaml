# Band profile for a UHF field trial around 469 MHz, sized for one 2 MS/s
# capture centred at 469.250000 MHz:
#
#   dmr-surveyor survey capture <dir> --band uhf_469_narrow --site <site> \
#     --center-frequency 469250000 --sample-rate 2000000 --duration 120
#
# The tuner is deliberately offset from any channel of interest so that the
# receiver's own DC/LO spike at the tuned centre does not land on it.
#
# Like every band profile, this says only *where to look* and *how to
# threshold what is found*. It encodes no frequency list and no protocol: a
# carrier found here is a spectral candidate, never a confirmed DMR (or
# Capacity Max) channel. Which frequency a geolocation trial cares about is
# reference data, imported separately and matched only after observation.
#
# The range is kept well inside the usable passband of a 2 MS/s capture so
# that `coverage_status: complete` means the whole profile was actually seen,
# not that the roll-off happened to be generous.
#
# Detection thresholds, rasters, segmentation and comparison tolerances are
# copied from `central_800_narrow.yaml` (a 12.5 kHz narrowband carrier looks
# the same to the detector at 469 MHz as at 868 MHz), so the two profiles
# measure on the same terms. Path-loss and shadowing defaults in the solver
# were chosen for 800 MHz and are not calibrated for UHF either way.
name: uhf_469_narrow
label: "UHF 469.000-469.500 MHz, one 2 MS/s capture"

start_frequency_hz: 469000000
stop_frequency_hz: 469500000

raster_spacings_hz:
  - 12500
  - 6250

detection:
  scan_step_hz: 6250
  integration_width_hz: 12500
  min_p95_channel_snr_db: 9.0
  min_average_channel_snr_db: 4.0
  min_equivalent_width_hz: 3000
  min_width_90_hz: 5000
  max_width_90_hz: 13000
  max_peak_to_channel_mean_db: 13.0
  min_fill_ratio: 0.20
  fill_threshold_db: 6.0
  merge_tolerance_hz: 4000

# A geolocation stop is a short stationary capture, so segmentation is tuned
# for persistence to mean something in 60-180 s.
segment_seconds: 1.0
segment_stride_seconds: 5.0
max_segments: 40

usable_passband_rolloff_db: 3.0

comparison:
  frequency_tolerance_hz: 6250
  snr_delta_db: 3.0
  occupancy_delta_pct: 10.0
  persistence_delta: 0.25
  analyzed_seconds_ratio_limit: 4.0
