name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      # Both versions must run to completion and both must be visible as
      # their own check, even if one fails first -- the Raspberry Pi field
      # deployment runs 3.13, CI so far has only ever checked 3.11, and a
      # failure on either version is real information, not something to
      # suppress with continue-on-error.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: pytest
      - name: Lint
        run: ruff check .
